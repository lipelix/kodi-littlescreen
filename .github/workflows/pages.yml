name: Pages

# Publishes the Kodi repository (scripts/build_repo.py) to
# https://lipelix.github.io/kodi-littlescreen/ when a v* tag is pushed.
# The tag must match the add-on version: v1.0.0 <-> version="1.0.0".
# A tag also gets a GitHub Release with the repository and add-on zips: the landing page and
# README link the repository zip there, so GitHub's download count shows roughly the first
# installs (updates come through Kodi and are not counted; nothing is sent from the device).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check -r requirements-dev.txt

      - name: Tag matches the add-on version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/.*<addon id="plugin.video.littlescreen"[^>]* version="\([^"]*\)".*/\1/p' \
            plugin.video.littlescreen/addon.xml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match add-on version $version"
            exit 1
          fi

      - name: Checks
        run: |
          .venv/bin/ruff check --output-format=github .
          .venv/bin/ruff format --check .
          .venv/bin/python -m pytest -q
          .venv/bin/kodi-addon-checker --branch omega plugin.video.littlescreen
          .venv/bin/kodi-addon-checker --branch omega repository.littlescreen

      - name: Build the repository tree
        run: .venv/bin/python scripts/build_repo.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Collect the release zips
        run: |
          mkdir _release
          cp _site/repository.littlescreen-*.zip _site/plugin.video.littlescreen/*.zip _release/

      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: _release
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: _release

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Little Screen ${TAG#v}" \
              --notes "Install the repository zip in Kodi (Settings → Add-ons → Install from zip file), then Little Screen from it. Guide: https://github.com/lipelix/kodi-littlescreen#install" \
              --generate-notes
          fi
          # upload only what is missing: replacing an asset would reset its download count
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for zip in _release/*.zip; do
            if ! grep -qxF "$(basename "$zip")" <<< "$have"; then
              gh release upload "$TAG" "$zip"
            fi
          done
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.downloadCount)"'
